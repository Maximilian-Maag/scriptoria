name: Set up the workspace
description: Checkout is the caller's job; this installs Node, pnpm and the dependencies with a warm store cache.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22

    - name: Set up pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        run_install: false

    - name: Get pnpm store path
      id: pnpm-cache
      shell: bash
      run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
      with:
        path: ${{ steps.pnpm-cache.outputs.store }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-

    # `--frozen-lockfile` so a lockfile that disagrees with the manifests fails
    # here rather than resolving to something nobody chose. NFR-01 wants a build
    # that does not depend on what a registry happens to serve today.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
