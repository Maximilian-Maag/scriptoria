name: policy

on:
  push:
  pull_request:

# The default token is read/write on a repository setting nobody here chose. The
# job clones and runs a checker over the files it already has; it publishes
# nothing, so it needs nothing.
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the checker ratchets against the base branch
          # `fetch-depth: 0` already leaves every ref the ratchet compares
          # against, and a token written into `.git/config` survives for the
          # rest of the job for no reason.
          persist-credentials: false
      - name: Policy as code
        run: python3 tools/policy_check.py --ci
