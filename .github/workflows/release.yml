name: Release

# What a release publishes, and the one decision it leaves to the repository.
#
# NFR-01 puts every provisioned environment in a network with no route out, so the thing that
# actually ships is the tarball `make deploy-images` writes — carried in and loaded with
# `deploy/scripts/load-images.sh`. A registry is for the places that *do* have a route: a
# staging box, a colleague's machine, a CI image cache. Which registry that is, and what
# credential pushes to it, is a decision nobody has taken, so it is **one repository variable
# and two secrets** rather than a constant in this file. Set them and this publishes; leave
# them unset and it says so and still builds, which is the honest state of a release pipeline
# whose destination is undecided.
#
# The frontend is deliberately **not** published. Its terminal WebSocket address is compiled
# into the bundle at build time (`apps/frontend/Dockerfile`, ADR-007), so it differs per
# environment and is built at deploy time from that environment's own address. A per-branch
# frontend image would be an image whose WebSocket points somewhere wrong. It is still built
# here, as a smoke test of its Dockerfile — nothing else in CI builds it.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

# A release is not cancelled by the next push. An image that half-pushed is worse than one a
# few minutes stale, and what an environment deploys is whatever the last complete run wrote.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Says which of the two shapes this run is, before it does anything: an operator reading
      # the log of a release that published nothing should not have to infer why.
      #
      # It also derives the branch tag *once*, here, and every later step uses it — tagging,
      # reading the manifest back, the summary. `GITHUB_REF_NAME` is whatever was dispatched,
      # and a `workflow_dispatch` run can be on any branch: a branch name may contain `/` and a
      # Docker tag may not, so `feat/thing` publishes as `feat-thing`. That can collide with a
      # branch literally called `feat-thing`, which is exactly why each image also carries its
      # commit — the commit tag is the one that means one thing.
      - name: Where this release goes
        env:
          REGISTRY: ${{ vars.REGISTRY }}
        run: |
          set -eu
          tag="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')"
          printf 'TAG=%s\nSHORT_SHA=%s\n' "${tag}" "${GITHUB_SHA:0:12}" >> "${GITHUB_ENV}"
          if [ -z "${REGISTRY}" ]; then
            echo "::notice::No registry is configured, so the images are built and not published. Set the repository variable REGISTRY and the secrets REGISTRY_USERNAME and REGISTRY_PASSWORD to publish."
          else
            echo "publishing to ${REGISTRY} as ${tag} and ${GITHUB_SHA:0:12}"
          fi

      # All three Dockerfiles, because this is the only job that builds them: the frontend too,
      # even though it is not published — the point here is that it builds from this commit.
      - name: Build the images
        run: make docker-build

      - name: Log in
        if: vars.REGISTRY != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Two tags per image: the branch, which is what a staging box follows, and the commit,
      # which is the only tag that can be pointed at a week later with any confidence.
      - name: Push
        if: vars.REGISTRY != ''
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_INSECURE: ${{ vars.REGISTRY_INSECURE }}
        run: |
          set -eu
          for image in backend runner; do
            for tag in "${TAG}" "${SHORT_SHA}"; do
              docker tag "scriptoria-${image}:latest" "${REGISTRY}/scriptoria-${image}:${tag}"
              docker push "${REGISTRY}/scriptoria-${image}:${tag}"
            done
          done
          # `docker push` exits 0 when the registry accepted the layers. Ask the registry
          # for the manifest, so "published" is read back rather than claimed — the tag is
          # what an environment will pull, and a typo in it fails here rather than at 3am.
          #
          # `docker manifest inspect` does not read the daemon's `insecure-registries`, so
          # against a registry served over plain HTTP it answers "no such manifest" for a tag
          # that was pushed a second earlier — proved by running this job against a local
          # `registry:2` on :5000, where the pushes succeeded and the inspect did not.
          #
          # --insecure is NOT a fallback: it also skips certificate *verification*, so a
          # registry that answers with a bad certificate would be read back anyway, which is
          # the one case where reading it back matters less than not trusting it. It is an
          # explicit opt-in for a registry an owner has declared plain-HTTP — set the
          # repository variable REGISTRY_INSECURE=true and nothing else changes.
          fail_readback() {
            echo "::error::$1 was pushed but cannot be read back from the registry"
            echo "::error::If this registry is served over plain HTTP, set the repository variable REGISTRY_INSECURE=true; if it has a certificate, the failure is real and the publish is unconfirmed."
            exit 1
          }
          for image in backend runner; do
            ref="${REGISTRY}/scriptoria-${image}:${TAG}"
            if [ "${REGISTRY_INSECURE}" = "true" ]; then
              docker manifest inspect --insecure "${ref}" > /dev/null || fail_readback "${ref}"
            else
              docker manifest inspect "${ref}" > /dev/null || fail_readback "${ref}"
            fi
          done
          {
            echo "### Published"
            for image in backend runner; do
              echo "- \`${REGISTRY}/scriptoria-${image}:${TAG}\` and \`:${SHORT_SHA}\`"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
