# Dependency updates, opened weekly.
#
# The lockfile is the decision here: CI installs with `pnpm install --frozen-lockfile`, so every
# update arrives as a manifest change plus its lockfile in one commit — which is exactly what a
# Dependabot pull request is.
#
# **The groups hold minor and patch updates only.** Grouping by dependency *type* looked tidier and
# was wrong: the first run produced three pull requests that between them carried
# `typescript 5 → 7`, `next 15 → 16`, `zod 3 → 4`, `vitest 2 → 5`, `eslint 9 → 10` and five major
# GitHub Actions. A group is atomic in review — the riskiest member decides whether the safe ones
# land — so one major in a group of patches means none of the patches merge. Majors are therefore
# left ungrouped: they arrive one per pull request, and each is taken on its own with CI as the gate
# and its changelog read before it is merged.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      development-minor-and-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
        patterns: ["*"]
      production-minor-and-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
