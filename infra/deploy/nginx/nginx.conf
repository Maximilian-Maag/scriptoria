# Scriptoria — the reverse proxy for a provisioned environment.
#
# This is the ONLY process in the environment with a public address (NFR-01).
# Everything it fronts — the frontend, the control plane, the runner, the data
# stores, the script VM and the directory — is reachable only from inside the
# VPC, and the routing here is what makes that true rather than a claim.
#
# Two things about the shape are deliberate:
#
#   1. The browser's REST surface is the *frontend*, always. It is the frontend
#      that holds the session cookie and forwards to the control plane from
#      server-side code, so no session material ever reaches browser JavaScript.
#      The control plane's own `/api/*` is therefore NOT exposed here: opening it
#      would put a second, weaker way in beside the one the architecture built.
#   2. The terminal WebSocket is the single exception. It goes straight to the
#      control plane, because a Next.js route handler cannot hold a socket open
#      for the life of a run (ADR-007) — and it is the product's critical path,
#      so it is routed explicitly rather than by accident.
#
# `/healthz` is the one control-plane path that is published, and it is republished
# under a name of its own so that a monitor outside the VPC (NFR-16) has an
# endpoint that cannot be mistaken for the API. Monitoring is external; no alerting
# lives in this platform.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # The version is not information a caller gets for free.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Upstreams ───────────────────────────────────────────────────────────────
    # One file per environment, because the process counts differ between them:
    # dev runs the control plane once, staging twice, production three times, and
    # the runner is its own instance in all three. Nothing here needs a sticky
    # session — a run's terminal stream lives in Redis rather than in the process
    # that opened it, so any control-plane process can serve any client, and a
    # rolling restart does not drop a PTY (the runner holds it).
    include /etc/nginx/scriptoria/upstreams/*.conf;

    # The public name, and the certificate. Both are deployment values, not
    # platform ones: the certificate is issued by the organisation's own CA, as
    # NFR-01's network has no route out to a public one.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Nothing is served over plain HTTP — the login posts a password.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/scriptoria/tls/fullchain.pem;
        ssl_certificate_key /etc/scriptoria/tls/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        # Harmless without a valid chain and useful with one; the environments are
        # TLS-only, so there is nothing for it to break.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        # A login form and JSON bodies; nothing legitimate is large. Results leave
        # through the frontend's proxy route and are streamed back, so this bound
        # is on requests only.
        client_max_body_size 2m;

        # ── The monitor's endpoint ──────────────────────────────────────────────
        # Rewritten onto the control plane's `/api/health`, and published under a
        # path of its own so that exposing it does not mean exposing `/api/`.
        location = /healthz {
            proxy_pass http://scriptoria_backend/api/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── The terminal ────────────────────────────────────────────────────────
        # The one path that goes to the control plane rather than through the
        # frontend, and the one that must not be buffered or timed out on the
        # scale of an ordinary request: a run is a conversation, and NFR-10 puts
        # individual runs well past a minute.
        location /terminal {
            proxy_pass http://scriptoria_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Everything else ─────────────────────────────────────────────────────
        location / {
            proxy_pass http://scriptoria_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The frontend reads the client address from the LAST entry of this
            # header — the one appended here — and only when the deployment says a
            # reverse proxy is in front of it. Somewhere in the audit trail that
            # address is a recorded fact (FA-12.1), so it is set here rather than
            # left for the client to supply.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Results stream through this path — a single file, or a ZIP whose
            # entries are fetched one at a time. Buffering them would spool a
            # download to the proxy's disk to no purpose, and for the ZIP it would
            # hold the whole archive.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
