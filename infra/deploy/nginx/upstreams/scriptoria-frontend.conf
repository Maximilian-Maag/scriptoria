# The frontend on this instance.
#
# One process, everywhere — including production. It renders and forwards; it
# holds no credentials of its own, and a second one would add a hop to every call
# the API proxy makes without buying a boundary (see the environment notes in
# README.md). It is the browser's whole REST surface.

upstream scriptoria_frontend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}
