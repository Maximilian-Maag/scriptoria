# The control plane's processes on this instance.
#
# One `server` line per process: dev runs one, staging two, production three. They
# are separate processes of the same image, published on 127.0.0.1 alone — nothing
# reaches a control plane except this proxy, and the proxy is on the same instance.
#
# Round-robin, and no sticky sessions: a run's terminal stream is a Redis stream
# rather than state in the process that opened it, so any of these can serve any
# client, and the proxy does not need to remember which one it used.

upstream scriptoria_backend {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;

    # A second (and in production a third) process, when the environment has one.
    # server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;

    keepalive 16;
}
